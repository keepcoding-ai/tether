<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atrium Bridge</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 520px; margin: 0 auto; padding: 24px 16px; }
    #status { margin-bottom: 4px; }
    #message { color: var(--ok); min-height: 1.4em; margin-top: 10px; }
    form button { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <div id="status" class="status" role="status"></div>
    <p id="intro"></p>
    <form id="form">
      <label for="name" id="label-name"></label>
      <input id="name" autocomplete="off" required>
      <small id="help-name"></small>

      <label for="port" id="label-port"></label>
      <input id="port" type="number" min="1" max="65535" inputmode="numeric" required>

      <label for="token" id="label-token"></label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
      <small id="help-token"></small>

      <button id="save" type="submit"></button>
      <div id="message" role="status"></div>
    </form>
    <section aria-labelledby="label-evaluate">
      <h2 id="label-evaluate" style="font-size:15px;margin:26px 0 2px"></h2>
      <p id="help-evaluate"></p>
      <div id="evaluate-choice" class="choice" role="radiogroup" aria-labelledby="label-evaluate">
        <button type="button" role="radio" data-value="off"><strong id="off-title"></strong><small id="off-hint"></small></button>
        <button type="button" role="radio" data-value="on"><strong id="on-title"></strong><small id="on-hint"></small></button>
      </div>
      <p id="risk" class="risk tape" hidden></p>
      <div id="evaluate-message" role="status" style="min-height:1.4em;margin-top:8px;color:var(--ok)"></div>
    </section>
    <section aria-labelledby="label-debug">
      <h2 id="label-debug" style="font-size:15px;margin:26px 0 2px"></h2>
      <p id="help-debug"></p>
      <div id="debug-choice" class="choice" role="radiogroup" aria-labelledby="label-debug">
        <button type="button" role="radio" data-value="off"><strong id="debug-off-title"></strong><small id="debug-off-hint"></small></button>
        <button type="button" role="radio" data-value="on"><strong id="debug-on-title"></strong><small id="debug-on-hint"></small></button>
      </div>
      <label for="debug-timeout" id="label-debug-timeout"></label>
      <input id="debug-timeout" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
      <small id="help-debug-timeout"></small>
      <p id="debug-state" role="status" style="margin-top:10px"></p>
      <small id="debug-trace"></small>
      <div id="debug-message" role="status" style="min-height:1.4em;margin-top:8px;color:var(--ok)"></div>
    </section>
    <div id="confirm" class="overlay" hidden>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
        <h2 id="confirm-title" class="tape"></h2>
        <div class="body"><p id="confirm-body"></p></div>
        <div class="actions">
          <button id="confirm-no" class="cancel" type="button"></button>
          <button id="confirm-yes" class="confirm" type="button"></button>
        </div>
      </div>
    </div>
    <label id="label-id"></label>
    <code id="id"></code>
  </main>
  <script type="module" src="dist/options.js"></script>
</body>
</html>
