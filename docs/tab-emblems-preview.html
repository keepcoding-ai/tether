<!doctype html>
<html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><title>tether · emblemas nas guias</title>
<style>
:root{--bg:#1b1b1f;--bg-2:#232329;--bg-3:#2c2c34;--bg-hover:#363640;--bg-hover-2:#3f3f4a;--fg:#d8d8dc;--fg-dim:#9a9aa3;--accent:#6aa6ff;--on-accent:#0d1320;--border:#35353d;--err:#ef6a6a;--ok:#5fcf80;--shadow:0 6px 20px rgba(0,0,0,.5);--desk-bg:#141418;--frame-bg:#1e1e23;--frame-border:rgba(255,255,255,.08);--x-alert:oklch(.70 .19 50);--ui:"Segoe UI",system-ui,sans-serif;color-scheme:dark;
 --x-red:oklch(.62 .22 25);--x-orange:oklch(.70 .19 50);--x-yellow:oklch(.86 .17 95);--x-lime:oklch(.80 .22 125);--x-green:oklch(.70 .20 148);--x-teal:oklch(.72 .14 178);--x-cyan:oklch(.78 .13 200);--x-sky:oklch(.70 .16 230);--x-blue:oklch(.58 .22 260);--x-purple:oklch(.58 .24 295);--x-magenta:oklch(.65 .27 322);--x-pink:oklch(.68 .22 355);--glyph-dark:#10131a;--glyph-light:#fff}
:root[data-theme="light"]{--bg:#fbfbfd;--bg-2:#f1f2f5;--bg-3:#e6e7ec;--bg-hover:#dcdde3;--bg-hover-2:#d2d3da;--fg:#24292f;--fg-dim:#5f6368;--accent:#1f6fe0;--on-accent:#fff;--border:#cfd1d8;--err:#c62828;--shadow:0 6px 20px rgba(0,0,0,.18);--desk-bg:#e7e9ed;--frame-bg:#fbfbfd;--frame-border:rgba(0,0,0,.09);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px var(--ui);background:var(--desk-bg);color:var(--fg)}
svg.ph{width:14px;height:14px;fill:currentColor;flex:none}
button{font:inherit;color:inherit}
.tg{position:fixed;top:10px;right:12px;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:0;background:none;color:var(--fg-dim);cursor:pointer}.tg:hover{background:var(--bg-hover);color:var(--fg)}
.wrap{max-width:980px;margin:0 auto;padding:56px 16px 40px}
.hint{color:var(--fg-dim);font-size:12px;margin:10px 2px 0;line-height:1.6}.hint b{color:var(--fg);font-weight:600}
/* frame + tab strip (tether's .tether-tab) */
.frame{background:var(--frame-bg);border:1px solid var(--frame-border);border-radius:10px;overflow:hidden}
.strip{display:flex;height:35px;background:var(--bg-2);border-bottom:1px solid var(--border)}
.tab{display:flex;align-items:center;gap:7px;padding:0 8px 0 11px;min-width:112px;max-width:220px;flex:0 1 auto;border-right:1px solid var(--border);color:var(--fg-dim);cursor:default;white-space:nowrap;position:relative;user-select:none}
.tab.on{background:var(--frame-bg);color:var(--fg)}.tab.on::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--accent)}
.tab .kind{color:#d97757;display:inline-flex}.tab .kind.sh{color:var(--fg-dim)}
.tab .text{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab .attn{width:8px;height:8px;border-radius:50%;background:var(--x-alert);flex:none}
.tab .x{border:0;background:none;padding:2px;border-radius:3px;color:var(--fg-dim);line-height:0;visibility:hidden;cursor:pointer}.tab:hover .x,.tab.on .x{visibility:visible}.tab .x:hover{background:var(--bg-hover-2);color:var(--fg)}
.tab .x svg{width:12px;height:12px}
/* the emblem: a rounded square chip, raw colour, glyph in the paired foreground. Static: no animation, no observers. */
.em{--c:var(--x-blue);--g:var(--glyph-light);display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--c);color:var(--g);flex:none;border:0;padding:0;cursor:pointer}
.em svg{width:11px;height:11px;fill:currentColor}
.em.lg{width:22px;height:22px;border-radius:5px}.em.lg svg{width:14px;height:14px}
.body{height:120px;display:grid;place-items:center;color:var(--fg-dim);font-size:12px}
/* menus */
.menu{position:fixed;z-index:20;min-width:220px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;background:none;border-radius:5px;text-align:left;cursor:pointer}
.mi:hover,.mi:focus-visible{background:var(--bg-hover);outline:0}.mi .ck{margin-left:auto;color:var(--accent)}.mi .dim{color:var(--fg-dim)}
.sep{height:1px;background:var(--border);margin:4px 2px}
.mh{padding:6px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
/* editor */
dialog{padding:0;border:1px solid var(--border);border-radius:10px;background:var(--bg-2);color:var(--fg);box-shadow:var(--shadow);width:min(860px,96vw);height:min(600px,92vh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.ed{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;height:100%}
.ed-h{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600}
.ed-h .sp{flex:1}.ib{width:28px;height:28px;display:grid;place-items:center;border:0;background:none;border-radius:6px;color:var(--fg-dim);cursor:pointer}.ib:hover{background:var(--bg-hover);color:var(--fg)}
.lst{border-right:1px solid var(--border);overflow:auto;padding:6px}
.li{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.li:hover{background:var(--bg-hover)}.li.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .meta{font-size:11px;color:var(--fg-dim)}
.li.new{color:var(--accent)}.li.hid{opacity:.5}
.fm{display:flex;flex-direction:column;min-height:0;padding:14px 16px 12px;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.lbl{width:46px;color:var(--fg-dim);font-size:12px;flex:none}
.inp{flex:1;height:30px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;outline:0}.inp:focus{border-color:var(--accent)}
.pv{display:flex;gap:8px;margin-left:auto}
.pvt{display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;font-size:12px;border:1px solid}
.pvt.d{background:#1e1e23;color:#d8d8dc;border-color:#35353d}.pvt.l{background:#fbfbfd;color:#24292f;border-color:#cfd1d8}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.s{width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;box-shadow:0 0 0 2px var(--bg-2)}
.s[aria-checked=true]{box-shadow:0 0 0 2px var(--bg-2),0 0 0 4px var(--fg)}
/* icon picker */
.pk{flex:1;min-height:0;display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto 1fr auto;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden}
.pk-s{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--border);color:var(--fg-dim)}
.pk-s input{flex:1;height:34px;border:0;background:none;color:var(--fg);font:inherit;outline:0}
.rail{display:flex;flex-direction:column;gap:2px;padding:6px 4px;border-right:1px solid var(--border);overflow:auto}
.rail button{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--fg-dim);cursor:pointer}
.rail button:hover{background:var(--bg-hover);color:var(--fg)}.rail button.on{background:var(--bg-3);color:var(--accent)}
.rail svg{width:16px;height:16px}
.grid{overflow:auto;padding:4px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--bg-hover) transparent;contain:strict}
.grid[hidden]{display:none}
.sec h4{position:sticky;top:0;margin:0;padding:8px 2px 5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim);background:var(--bg);z-index:1}
.cells{display:grid;grid-template-columns:repeat(auto-fill,34px);gap:2px}
.c{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--fg);cursor:pointer;padding:0}
.c:hover,.c:focus-visible{background:var(--bg-hover);outline:0}.c[aria-selected=true]{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.c svg{width:18px;height:18px;fill:currentColor}
.empty{padding:28px 6px;color:var(--fg-dim);text-align:center}
.pk-f{grid-column:1/-1;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-top:1px solid var(--border);font-size:12px;color:var(--fg-dim)}
.pk-f b{color:var(--fg);font-weight:600}.pk-f .perf{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.75}
.ft{display:flex;align-items:center;gap:8px}
.bt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border);background:var(--frame-bg);cursor:pointer;font-size:12px}
.bt:hover{background:var(--bg-3)}.bt.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.bt.dng{color:var(--err)}.bt.dng.solid{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}
.bt svg{width:13px;height:13px}.ft .sp{flex:1}.ft .msg{font-size:12px;color:var(--fg)}
@media (max-width:640px){.ed{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.lst{border-right:0;border-bottom:1px solid var(--border);display:flex;overflow-x:auto;max-height:none}.li{width:auto;flex:none}.li .meta{display:none}.pv{display:none}}

const chip=(e,cls='')=>e?`<span class="em ${cls}" style="--c:var(--x-${e.color});--g:var(${DARK_GLYPH.has(e.color)?'--glyph-dark':'--glyph-light'})" title="${esc(e.name)}">${use(e.icon)}</span>`:''
const uses=id=>tabs.filter(t=>t.emblem===id).length

/* ---- tab strip: rendered whole only when something changes (no timers, no observers) ---- */
function renderStrip(){
 $('#strip').innerHTML=tabs.map(t=>{const e=t.emblem&&byId(t.emblem);return `<div class="tab${t.id===activeTab?' on':''}" data-t="${t.id}">
  <span class="kind${t.kind==='sh'?' sh':''}"><svg class="ph"><use href="#p-${t.kind==='sh'?'terminal-window':'sparkle'}"/></svg></span>
  ${e&&!e.hidden?chip(e).replace('<span class="em','<span data-em class="em'):''}<span class="text">${esc(t.text)}</span>${t.attn?'<span class="attn" title="Pede atenção (sistema)"></span>':''}
  <button class="x" title="Fechar guia" data-close>${uu('x')}</button></div>`}).join('')
}
$('#strip').addEventListener('click',ev=>{const tab=ev.target.closest('.tab');if(!tab)return;const id=+tab.dataset.t
 if(ev.target.closest('[data-close]')){tabs=tabs.filter(t=>t.id!==id);renderStrip();return}
 if(ev.target.closest('[data-em]')){openMenu(id,ev);return}
 activeTab=id;renderStrip()})
$('#strip').addEventListener('contextmenu',ev=>{const tab=ev.target.closest('.tab');if(!tab)return;ev.preventDefault();openMenu(+tab.dataset.t,ev)})

/* ---- "Emblema" menu on a tab ---- */
let menuTab=null
function openMenu(tid,ev){menuTab=tid;const t=tabs.find(x=>x.id===tid),m=$('#menu')
 m.innerHTML=`<div class="mh">Emblema</div>`+emblems.filter(e=>!e.hidden).map(e=>`<button class="mi" role="menuitemradio" data-pick="${e.id}">${chip(e)}<span>${esc(e.name)}</span>${t.emblem===e.id?`<svg class="ph ck"><use href="#u-check"/></svg>`:''}</button>`).join('')
  +`<button class="mi" data-pick=""><span class="em" style="--c:transparent;box-shadow:inset 0 0 0 1px var(--border)"></span><span class="dim">Nenhum</span>${!t.emblem?`<svg class="ph ck"><use href="#u-check"/></svg>`:''}</button><div class="sep"></div><button class="mi" data-manage>Gerenciar emblemas…</button>`
 m.hidden=false;const r=m.getBoundingClientRect();m.style.left=Math.min(ev.clientX,innerWidth-r.width-8)+'px';m.style.top=Math.min(ev.clientY+4,innerHeight-r.height-8)+'px';m.querySelector('.mi').focus()}
const closeMenu=()=>{$('#menu').hidden=true}
$('#menu').addEventListener('click',ev=>{const b=ev.target.closest('.mi');if(!b)return
 if(b.hasAttribute('data-manage')){closeMenu();const t=tabs.find(x=>x.id===menuTab);openEditor(t?.emblem);return}
 const t=tabs.find(x=>x.id===menuTab);t.emblem=b.dataset.pick||null;closeMenu();renderStrip()})
addEventListener('pointerdown',ev=>{if(!$('#menu').hidden&&!ev.target.closest('#menu'))closeMenu()})
addEventListener('keydown',ev=>{if(ev.key==='Escape')closeMenu()})

/* ---- editor ---- */
const ed=$('#ed')
function openEditor(id){sel=(id&&byId(id))?id:emblems[0].id;buildPicker();renderList();renderForm();ed.showModal()}
$('#ed-x').onclick=()=>ed.close()
ed.addEventListener('close',()=>{askingDelete=false;renderStrip()})
function renderList(){
 $('#lst').innerHTML=emblems.map(e=>`<button class="li${e.id===sel?' sel':''}${e.hidden?' hid':''}" data-sel="${e.id}">${chip(e,'lg')}<span class="nm">${esc(e.name||'Sem nome')}</span><span class="meta">${e.hidden?'oculto':e.builtin?'padrão':''}</span></button>`).join('')
  +`<button class="li new" data-new><span class="em lg" style="--c:transparent;--g:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)">${uu('plus')}</span><span class="nm">Novo emblema</span></button>`}
$('#lst').addEventListener('click',ev=>{const b=ev.target.closest('.li');if(!b)return;askingDelete=false
 if(b.hasAttribute('data-new')){const e={id:'u'+Date.now(),name:'',color:'blue',icon:'tag',builtin:false,hidden:false};emblems.push(e);sel=e.id;renderList();renderForm();$('#f-name').focus();return}
 sel=b.dataset.sel;renderList();renderForm()})
const cur=()=>byId(sel)
function renderForm(){const e=cur();$('#f-name').value=e.name;$('#f-name').placeholder='ex.: Cliente, Urgente, Leitura'
 $('#sw').innerHTML=COLORS.map(c=>`<button class="s" role="radio" aria-checked="${c===e.color}" title="${PT_COLOR[c]}" style="--c:var(--x-${c})" data-c="${c}"></button>`).join('')
 renderPreview();markSelectedIcon();renderFooter()}
function renderPreview(){const e=cur(),n=esc(e.name||'Sem nome');$('#pv').innerHTML=`<span class="pvt d">${chip(e)}<span>atrium</span></span><span class="pvt l">${chip(e)}<span>atrium</span></span>`;
 const li=$(`#lst [data-sel="${e.id}"]`);if(li){li.querySelector('.em').outerHTML=chip(e,'lg');li.querySelector('.nm').textContent=e.name||'Sem nome'}}
$('#f-name').addEventListener('input',ev=>{cur().name=ev.target.value;renderPreview()})
$('#sw').addEventListener('click',ev=>{const b=ev.target.closest('.s');if(!b)return;cur().color=b.dataset.c;for(const s of $('#sw').children)s.setAttribute('aria-checked',s===b);renderPreview();renderFooter()})
let askingDelete=false
function renderFooter(){const e=cur(),n=uses(e.id),def=DEFAULTS.find(d=>d.id===e.id),changed=def&&(def.name!==e.name||def.color!==e.color||def.icon!==e.icon)
 if(askingDelete){$('#ft').innerHTML=`<span class="msg">${e.builtin?'Ocultar':'Excluir'} “${esc(e.name||'Sem nome')}”?${n?` Está em ${n} guia${n>1?'s':''}, que ficam sem emblema.`:''}</span><span class="sp"></span><button class="bt" data-a="cancel">Cancelar</button><button class="bt dng solid" data-a="confirm">${e.builtin?'Ocultar':'Excluir'}</button>`;return}
 $('#ft').innerHTML=(e.builtin&&e.hidden?`<button class="bt" data-a="show">Mostrar de novo</button>`:`<button class="bt dng" data-a="del">${uu('trash')}${e.builtin?'Ocultar':'Excluir'}</button>`)
  +(changed?`<button class="bt" data-a="reset">${uu('arrow-counter-clockwise')}Restaurar padrão</button>`:'')
  +`<span class="sp"></span><span class="msg" style="color:var(--fg-dim)">${n?`Em ${n} guia${n>1?'s':''}`:'Em nenhuma guia'}</span><button class="bt pri" data-a="done">Pronto</button>`}
$('#ft').addEventListener('click',ev=>{const a=ev.target.closest('[data-a]')?.dataset.a,e=cur();if(!a)return
 if(a==='del'){askingDelete=true;renderFooter()}else if(a==='cancel'){askingDelete=false;renderFooter()}
 else if(a==='confirm'){askingDelete=false;for(const t of tabs)if(t.emblem===e.id)t.emblem=null
  if(e.builtin){e.hidden=true}else{emblems=emblems.filter(x=>x!==e);sel=emblems[0].id};renderList();renderForm()}
 else if(a==='show'){e.hidden=false;renderList();renderFooter()}
 else if(a==='reset'){Object.assign(e,DEFAULTS.find(d=>d.id===e.id));renderList();renderForm()}
 else if(a==='done')ed.close()})

/* ---- icon picker ----
   Performance: one <symbol> per icon in a sprite, every cell is a tiny <svg><use>. The grid is built ONCE (one innerHTML
   string), every interaction is event delegation (one listener per container), the category highlight comes from an
   IntersectionObserver (no scroll handler), search runs over a pre-normalised index and is coalesced to one pass per frame. */
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
const INDEX=ICONS.map(i=>({n:i.n,name:norm(i.n.replace(/-/g,' ')),words:[...new Set(norm(`${i.pt} ${i.en} ${i.n.replace(/-/g,' ')}`).split(/[\s,]+/).filter(Boolean))],phrase:norm(i.pt)}))
const LABEL=Object.fromEntries(ICONS.map(i=>[i.n,i.pt.split(' ').slice(0,3).join(', ')]))
const cell=n=>`<button class="c" role="option" data-i="${n}" title="${n}">${use(n)}</button>`
let built=false,spy
function buildPicker(){if(built)return;built=true;const t0=performance.now()
 $('#rail').innerHTML=`<button data-cat="recent" title="Em uso">${uu('clock-counter-clockwise')}</button>`+CATS.map(c=>`<button data-cat="${c.id}" title="${c.label}">${use(c.ci)}</button>`).join('')
 $('#grid').innerHTML=`<section class="sec" id="s-recent"><h4>Em uso</h4><div class="cells" id="recent"></div></section>`+CATS.map(c=>`<section class="sec" id="s-${c.id}"><h4>${c.label}</h4><div class="cells">${ICONS.filter(i=>i.c===c.id).map(i=>cell(i.n)).join('')}</div></section>`).join('')
 spy=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){const id=e.target.id.slice(2);for(const b of $('#rail').children)b.classList.toggle('on',b.dataset.cat===id)}},{root:$('#grid'),rootMargin:'0px 0px -85% 0px'})
 for(const s of $('#grid').children)spy.observe(s)
 $('#perf').textContent=`${ICONS.length} ícones · montado em ${(performance.now()-t0).toFixed(1)} ms`}
function renderRecent(){const used=[...new Set(emblems.map(e=>e.icon))];$('#recent').innerHTML=used.map(cell).join('')}
function markSelectedIcon(){renderRecent();const n=cur().icon;for(const b of document.querySelectorAll('.c[aria-selected=true]'))b.removeAttribute('aria-selected');for(const b of document.querySelectorAll(`.c[data-i="${n}"]`))b.setAttribute('aria-selected','true')}
$('#rail').addEventListener('click',ev=>{const b=ev.target.closest('[data-cat]');if(!b)return;if($('#q').value){$('#q').value='';runSearch()}
 const s=$('#s-'+b.dataset.cat);$('#grid').scrollTo({top:s.offsetTop-$('#grid').offsetTop})})
function pickIcon(ev){const b=ev.target.closest('.c');if(!b)return;cur().icon=b.dataset.i;markSelectedIcon();renderPreview();renderFooter()}
$('#grid').addEventListener('click',pickIcon);$('#res').addEventListener('click',pickIcon)
let lastHov=''
function hover(ev){const b=ev.target.closest('.c');const n=b?b.dataset.i:'';if(n===lastHov)return;lastHov=n
 $('#hov').innerHTML=n?`<b>${n}</b> · ${esc(LABEL[n]||'')}`:'&nbsp;'}
for(const g of ['#grid','#res']){$(g).addEventListener('pointerover',hover);$(g).addEventListener('focusin',hover)}
// rank: 0 name starts with query · 1 exact keyword · 2 keyword starts with query · 3 pt phrase contains query
function search(q){const terms=norm(q).trim().split(/\s+/).filter(Boolean);if(!terms.length)return null;const out=[]
 for(const it of INDEX){let score=0
  for(const t of terms){let s=9
   if(it.name.startsWith(t))s=0;else if(it.words.includes(t))s=1;else if(it.words.some(w=>w.startsWith(t)))s=2;else if(t.length>2&&it.phrase.includes(t))s=3
   if(s===9){score=-1;break}score+=s}
  if(score>=0)out.push([score,it.n])}
 return out.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1])).map(x=>x[1])}
let raf=0
function runSearch(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const q=$('#q').value,t0=performance.now(),r=search(q)
 if(!r){$('#res').hidden=true;$('#grid').hidden=false;$('#rail').style.opacity='';$('#perf').textContent=`${ICONS.length} ícones`;return}
 $('#grid').hidden=true;$('#res').hidden=false;$('#rail').style.opacity='.35'
 $('#res').innerHTML=r.length?`<section class="sec"><h4>${r.length} resultado${r.length>1?'s':''}</h4><div class="cells">${r.map(cell).join('')}</div></section>`:`<div class="empty">Nenhum ícone para “${esc(q)}”.</div>`
 markSelectedIcon();$('#perf').textContent=`busca em ${(performance.now()-t0).toFixed(2)} ms`})}
$('#q').addEventListener('input',runSearch)
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();const b=$('#res:not([hidden]) .c');if(b)b.click()}
 else if(ev.key==='ArrowDown'){ev.preventDefault();($('#res:not([hidden]) .c')||$('#grid .c'))?.focus()}})
// arrow keys move inside the visible grid
for(const g of ['#grid','#res'])$(g).addEventListener('keydown',ev=>{const b=ev.target.closest('.c');if(!b)return
 const all=[...$(g).querySelectorAll('.c')],i=all.indexOf(b),cols=Math.max(1,Math.floor(b.parentElement.clientWidth/36))
 const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[ev.key];if(d==null)return;ev.preventDefault();(all[i+d]||b).focus()})

$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
renderStrip()
</script>
</body></html>
